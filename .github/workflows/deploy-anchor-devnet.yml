name: Deploy Anchor Program to Devnet

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: Solana cluster
        required: true
        default: devnet
        type: choice
        options:
          - devnet
      anchor_version:
        description: Anchor CLI version
        required: true
        default: 0.30.1

jobs:
  deploy:
    name: Build and deploy Aura Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_URL: https://api.devnet.solana.com
      ANCHOR_VERSION: ${{ inputs.anchor_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"

      - name: Restore deploy wallet from secret
        env:
          SOLANA_DEPLOY_KEYPAIR: ${{ secrets.SOLANA_DEPLOY_KEYPAIR }}
        run: |
          test -n "$SOLANA_DEPLOY_KEYPAIR"
          mkdir -p "$HOME/.config/solana"
          printf '%s' "$SOLANA_DEPLOY_KEYPAIR" > "$HOME/.config/solana/aura-devnet.json"
          chmod 600 "$HOME/.config/solana/aura-devnet.json"
          solana config set --url "$SOLANA_URL" --keypair "$HOME/.config/solana/aura-devnet.json"
          solana address
          solana balance || true

      - name: Sync program key and build
        run: |
          anchor keys sync
          anchor build

      - name: Deploy to devnet
        run: |
          anchor deploy --provider.cluster "${{ inputs.cluster }}"
          anchor keys list
